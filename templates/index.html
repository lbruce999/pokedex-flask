<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pokédex</title>

    <link

        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"

        rel="stylesheet"

    >
    <!-- Bootstrap 5 -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">


</head>

<body>
    <main class="container py-4 py-lg-5">
        <section class="pokedex-shell mx-auto">

            <!-- Pokédex Header -->
            <header class="pokedex-header">
                <div class="d-flex align-items-center gap-3">
                    <div class="pokedex-lens" aria-hidden="true">
                        <div class="pokedex-lens-shine"></div>
                    </div>

                    <div class="status-lights" aria-hidden="true">
                        <span class="status-light status-light-red"></span>
                        <span class="status-light status-light-yellow"></span>
                        <span class="status-light status-light-green"></span>
                    </div>
                </div>

                <div class="mt-4">
                    <p class="pokedex-eyebrow mb-1">Pokémon Database</p>
                    <h1 class="pokedex-title mb-0">Pokédex</h1>
                </div>
            </header>

            <!-- Main Screen -->
            <div class="pokedex-body">
                <div class="row g-4">

                    <!-- Search / Display -->
                    <div class="col-12 col-lg-7">
                        <div class="screen-panel h-100">

                            <!-- Search Form -->
                            <form
                                id="pokemon-search-form"
                                class="mb-4"
                                autocomplete="off"
                            >
                                <label
                                    for="pokemon-search"
                                    class="form-label fw-semibold"
                                >
                                    Search Pokémon
                                </label>

                                <div class="input-group">
                                    <input
                                        type="search"
                                        class="form-control form-control-lg"
                                        id="pokemon-search"
                                        name="pokemon-search"
                                        placeholder="Name or Pokédex number"
                                        aria-label="Pokémon name or Pokédex number"
                                    >

                                    <button
                                        class="btn btn-dark px-4"
                                        type="submit"
                                        id="pokemon-search-button"
                                    >
                                        Search
                                    </button>
                                </div>
                            </form>

                            <!-- Loading Message -->
                            <div
                                id="loading-message"
                                class="alert alert-info d-none"
                                role="status"
                                aria-live="polite"
                            >
                                Loading Pokémon...
                            </div>

                            <!-- Error Message -->
                            <div
                                id="error-message"
                                class="alert alert-danger d-none"
                                role="alert"
                                aria-live="assertive"
                            >
                                Unable to load Pokémon.
                            </div>

                            <!-- Pokémon Card -->
                            <article
                                id="pokemon-card"
                                class="card pokemon-card border-0 shadow-sm"
                            >
                                <div class="card-body p-4">
                                    <div class="pokemon-image-area mb-4">
                                        <img
                                            id="pokemon-image"
                                            class="pokemon-image"
                                            src=""
                                            alt="Pokémon"
                                        >
                                    </div>

                                    <div
                                        class="d-flex flex-column flex-sm-row justify-content-between align-items-sm-start gap-2 mb-3"
                                    >
                                        <div>
                                            <p
                                                id="pokemon-id"
                                                class="pokemon-number mb-1"
                                            >
                                                #000
                                            </p>

                                            <h2
                                                id="pokemon-name"
                                                class="pokemon-name mb-0"
                                            >
                                                Pokémon Name
                                            </h2>
                                        </div>

                                        <!-- Pokémon Types -->
                                        <div
                                            id="pokemon-types"
                                            class="d-flex flex-wrap gap-2"
                                            aria-label="Pokémon types"
                                        >
                                            <!--
                                                ADD TYPE BADGES HERE
                                                WITH YOUR OWN RENDERING LOGIC.
                                            -->
                                        </div>
                                    </div>

                                    <hr class="pokemon-divider">

                                    <div class="row g-3">
                                        <div class="col-6">
                                            <div class="stat-box">
                                                <span class="stat-label">
                                                    Height
                                                </span>

                                                <span
                                                    id="pokemon-height"
                                                    class="stat-value"
                                                >
                                                    —
                                                </span>
                                            </div>
                                        </div>

                                        <div class="col-6">
                                            <div class="stat-box">
                                                <span class="stat-label">
                                                    Weight
                                                </span>

                                                <span
                                                    id="pokemon-weight"
                                                    class="stat-value"
                                                >
                                                    —
                                                </span>
                                            </div>
                                        </div>

                                        <div class="col-12">
                                            <div class="stat-box">
                                                <span class="stat-label">
                                                    Abilities
                                                </span>

                                                <div
                                                    id="pokemon-abilities"
                                                    class="abilities-container"
                                                >
                                                    <!--
                                                        ADD ABILITIES HERE
                                                        WITH YOUR OWN
                                                        RENDERING LOGIC.
                                                    -->
                                                </div>
                                            </div>
                                        </div>

                                        <div class="col-12">
                                            <div class="stat-box">
                                                <span class="stat-label">
                                                    Base Experience
                                                </span>

                                                <span
                                                    id="pokemon-base-experience"
                                                    class="stat-value"
                                                >
                                                    —
                                                </span>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </article>
                        </div>
                    </div>

                    <!-- Decorative Pokédex Controls -->
                    <div class="col-12 col-lg-5">
                        <aside
                            class="controls-panel h-100"
                            aria-label="Pokédex decorative controls"
                        >
                            <div class="controls-screen mb-4">
                                <span class="controls-label">
                                    Pokédex System
                                </span>

                                <strong>READY</strong>
                            </div>

                            <div class="row g-2 mb-4">
                                <div class="col-6">
                                    <div class="decorative-button"></div>
                                </div>

                                <div class="col-6">
                                    <div class="decorative-button"></div>
                                </div>
                            </div>

                            <div class="decorative-grid mb-4" aria-hidden="true">
                                <span></span>
                                <span></span>
                                <span></span>
                                <span></span>
                                <span></span>
                                <span></span>
                                <span></span>
                                <span></span>
                                <span></span>
                                <span></span>
                            </div>

                            <div
                                class="d-flex align-items-center justify-content-between gap-4 mt-auto"
                            >
                                <div
                                    class="direction-pad"
                                    aria-hidden="true"
                                >
                                    <span class="dpad-up"></span>
                                    <span class="dpad-right"></span>
                                    <span class="dpad-down"></span>
                                    <span class="dpad-left"></span>
                                    <span class="dpad-center"></span>
                                </div>

                                <div class="flex-grow-1">
                                    <div class="speaker-lines">
                                        <span></span>
                                        <span></span>
                                        <span></span>
                                        <span></span>
                                    </div>
                                </div>
                            </div>
                        </aside>
                    </div>

                </div>
            </div>
        </section>
    </main>

    <!-- Bootstrap 5 JavaScript -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    ></script>


<script src="{{ url_for('static', filename='app.js') }}"></script>

</body>
</html>
